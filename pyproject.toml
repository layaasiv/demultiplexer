[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmux"
version = "0.1.0"
description = "Dual-index FASTQ demultiplexing tool"
requires-python = ">=3.10"

[project.scripts]
dmux = "dmux.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]